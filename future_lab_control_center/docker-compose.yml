version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: future_lab_backend
    network_mode: "host"
    volumes:
      - /home/future-lab/B002_Future_Lab_Bots/cobot:/cobot
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: future_lab_frontend
    network_mode: "host"
    env_file:
      - .env
    restart: unless-stopped
